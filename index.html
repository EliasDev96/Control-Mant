<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#1B3A4B">
<title>Control Mant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ===================================================================
   Control Mant — panel de instrumentos para trabajo en campo
   La única saturación de color del sistema es el semáforo.
   Todo lo demás es acero, para que el color signifique algo.
   =================================================================== */

:root{
  --ink:#131A1F;
  --ink-2:#4A5A66;
  --ink-3:#7A8B96;
  --canvas:#E9EDF0;
  --surface:#FFFFFF;
  --line:#CFD8DE;
  --steel:#1B3A4B;
  --steel-2:#2E6480;

  --s0:#C5221F;  /* Rojo    */
  --s1:#E8710A;  /* Naranja */
  --s2:#EDB100;  /* Amarillo*/
  --s3:#137333;  /* Verde   */

  --r:10px;
  --pad:14px;
  --tap:48px;                       /* objetivo táctil mínimo */
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;
  overscroll-behavior-y:contain;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}

/* ---------- Barra superior ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--steel);color:#fff;
  padding:calc(var(--safe-t) + 9px) var(--pad) 9px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 0 rgba(0,0,0,.15);
}
.top .back{
  background:none;border:0;color:#fff;font-size:26px;line-height:1;
  width:40px;height:40px;margin-left:-10px;cursor:pointer;border-radius:10px;
  display:grid;place-items:center;flex-shrink:0;
}
.top .back:active{background:rgba(255,255,255,.16)}
.top .tt{flex:1;min-width:0}
.top h1{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:11.5px;opacity:.74;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;background:#7A8B96}
.dot.on{background:#31C48D}
.pend{
  background:rgba(255,255,255,.16);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:700;
  border:0;color:#fff;cursor:pointer;min-height:34px;
}
.pend.hot{background:var(--s1)}

/* ---------- Contenedor ---------- */
main{padding:var(--pad);padding-bottom:calc(104px + var(--safe-b));max-width:640px;margin:0 auto}
body.kb main{padding-bottom:28px}
.screen{display:none}
.screen.on{display:block}

/* ---------- Tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:11px}
.card.tight{padding:11px var(--pad)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.muted{color:var(--ink-2);font-size:14px}
.tiny{font-size:12.5px;color:var(--ink-3)}

/* ---------- Menú principal ---------- */
.menu{display:grid;gap:9px}
.menu button{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px var(--pad);cursor:pointer;min-height:72px;
}
.menu button:active{background:#F2F6F8}
.menu .ico{width:38px;height:38px;border-radius:9px;background:var(--steel);color:#fff;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.menu .lbl{flex:1;min-width:0}
.menu .lbl b{display:block;font-size:16px;font-weight:700}
.menu .lbl span{font-size:13px;color:var(--ink-2)}
.menu .arw{color:var(--ink-3);font-size:20px}

/* ---------- Campos ---------- */
label.f{display:block;margin-bottom:13px}
label.f>span,.flabel{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:13px 12px;border:1px solid var(--line);
  border-radius:9px;background:#fff;font-size:16px;   /* 16px evita el zoom de iOS */
  min-height:var(--tap);
}
select{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%234A5A66' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel-2);outline-offset:1px}
textarea{min-height:80px;resize:vertical;line-height:1.45}
input[type=number]{-moz-appearance:textfield;text-align:center;font-weight:700}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.opener{
  width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:13px 12px;min-height:var(--tap);cursor:pointer;
  display:flex;align-items:center;gap:10px;
}
.opener .ph{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opener .ph.set{color:var(--ink);font-weight:650}
.opener .arw{margin-left:auto;color:var(--ink-3);flex-shrink:0}

/* ---------- Buscador a pantalla completa ---------- */
.sheet{position:fixed;inset:0;z-index:70;background:var(--canvas);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .sh{background:var(--steel);padding:calc(var(--safe-t) + 9px) var(--pad) 11px;display:flex;gap:9px;align-items:center}
.sheet .sh button{background:none;border:0;color:#fff;font-size:26px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.sheet .sh input{flex:1;min-width:0;border:0;border-radius:9px;padding:12px}
.sheet .sl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:9px var(--pad) calc(24px + var(--safe-b))}
.sheet .sl button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:7px;cursor:pointer;min-height:var(--tap)}
.sheet .sl button:active{background:#F2F6F8}
.sheet .sl .fmt{font-size:11px;color:var(--ink-3);font-weight:800;letter-spacing:.06em}

/* ---------- Semáforo: el elemento central del sistema ---------- */
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:2px}
.grade button{
  border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:9px 2px 7px;cursor:pointer;min-height:66px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.grade .chip{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.grade .n{font-size:10px;font-weight:800;color:var(--ink-3);letter-spacing:.02em;text-transform:uppercase}
.grade button[data-v="0"] .chip{background:var(--s0)}
.grade button[data-v="1"] .chip{background:var(--s1)}
.grade button[data-v="2"] .chip{background:var(--s2);color:#3A2C00}
.grade button[data-v="3"] .chip{background:var(--s3)}
.grade button.sel{border-width:2.5px;background:#F6FAFB}
.grade button.sel .n{color:var(--ink)}
.grade button.sel[data-v="0"]{border-color:var(--s0)}
.grade button.sel[data-v="1"]{border-color:var(--s1)}
.grade button.sel[data-v="2"]{border-color:var(--s2)}
.grade button.sel[data-v="3"]{border-color:var(--s3)}

/* ---------- Contador con − y + ---------- */
.step{display:flex;gap:7px;align-items:stretch}
.step button{
  width:var(--tap);min-height:var(--tap);flex-shrink:0;
  border:1px solid var(--line);background:#fff;border-radius:9px;
  font-size:23px;font-weight:600;line-height:1;cursor:pointer;color:var(--steel);
}
.step button:active{background:#E7EEF2}
.step input{flex:1;min-width:0}

/* ---------- Medidor de operatividad ---------- */
.gauge{margin-top:12px;background:#F5F8F9;border-radius:9px;padding:11px 12px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.gauge .val{font-size:21px;font-weight:800}
.gauge .track{height:8px;background:#DFE6EA;border-radius:99px;overflow:hidden}
.gauge .fill{height:100%;border-radius:99px;transition:width .2s ease}
.f0{background:var(--s0)} .f1{background:var(--s1)}
.f2{background:var(--s2)} .f3{background:var(--s3)}
.c0{color:var(--s0)} .c1{color:var(--s1)} .c2{color:var(--s2)} .c3{color:var(--s3)}

/* ---------- Sector ---------- */
.sector{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sector>summary{list-style:none;cursor:pointer;padding:15px var(--pad);display:flex;align-items:center;gap:11px;min-height:58px}
.sector>summary::-webkit-details-marker{display:none}
.sector[open]>summary{position:sticky;top:calc(var(--safe-t) + 52px);z-index:20;background:#fff;border-bottom:1px solid #EEF2F4}
.sector .sq{width:13px;height:13px;border-radius:4px;background:#DFE6EA;flex-shrink:0}
.sector .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sector .st{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex-shrink:0}
.sector .body{padding:0 var(--pad) var(--pad)}

.eq{padding:14px 0;border-bottom:1px solid #F0F4F6}
.eq:last-of-type{border-bottom:0}
.eq .en{font-weight:650;margin-bottom:10px;font-size:15.5px}
.qty{display:grid;gap:11px}
.qty label{margin:0}

.warn{background:#FDF3E7;border:1px solid #F0C99A;color:#8A4B08;border-radius:9px;padding:10px 11px;font-size:13px;margin-top:9px}
.next{width:100%;margin-top:14px;padding:13px;border-radius:9px;border:1px dashed var(--line);background:#F5F8F9;color:var(--steel);font-weight:700;cursor:pointer;min-height:var(--tap)}

/* ---------- Barra de acciones ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(233,237,240,.95);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:11px var(--pad) calc(11px + var(--safe-b));
  display:flex;gap:9px;max-width:640px;margin:0 auto;
}
body.kb .bar{display:none}          /* el teclado abierto no debe tapar el campo */
.btn{flex:1;padding:15px 12px;border-radius:10px;border:1px solid var(--steel);background:var(--steel);color:#fff;font-weight:700;cursor:pointer;min-height:52px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45}
.btn.ghost{background:transparent;color:var(--steel)}
.btn.sm{padding:10px 13px;flex:0 0 auto;font-size:14px;min-height:44px}

/* ---------- Lista ---------- */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px var(--pad);margin-bottom:8px;display:flex;gap:11px;align-items:center}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m span{font-size:12.5px;color:var(--ink-2)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:5px 9px;border-radius:999px;text-transform:uppercase;flex-shrink:0}
.tag.bor{background:#EEF2F4;color:var(--ink-2)}
.tag.pen{background:#FDF0E2;color:#8A4B08}
.tag.syn{background:#E4F2E8;color:#137333}
.tag.err{background:#FBE6E5;color:#9B1C19}

/* ---------- Tablero ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 8px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:10px;color:var(--ink-3);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.bars{display:grid;gap:9px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 96px 40px;gap:8px;align-items:center;font-size:13.5px}
.brow>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{height:20px;background:#DFE6EA;border-radius:4px;overflow:hidden;display:flex}
.brow .bt i{display:block;height:100%}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- Varios ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.55}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + var(--safe-b));z-index:80;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;
  font-size:14px;max-width:88%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.on{opacity:1}
body.kb .toast{bottom:24px}
.steps{display:flex;gap:5px;margin-bottom:14px}
.steps i{flex:1;height:3px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--steel)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:520px){ .qty{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>

<header class="top">
  <button class="back" id="btnBack" hidden aria-label="Volver">‹</button>
  <div class="tt"><h1 id="ttl">Control Mant</h1><div class="sub" id="sub" hidden></div></div>
  <div class="badges">
    <span class="dot" id="dot" title="Conexión"></span>
    <button class="pend" id="pend" hidden></button>
  </div>
</header>

<main>

  <!-- ============ INICIO ============ -->
  <section class="screen on" id="sc-inicio">
    <div class="card tight">
      <div class="eyebrow">Supervisor</div>
      <div id="whoName" style="font-weight:700">—</div>
    </div>
    <div class="menu">
      <button data-go="nueva"><span class="ico">✚</span><span class="lbl"><b>Nueva inspección</b><span>Cargar una visita a un local</span></span><span class="arw">›</span></button>
      <button data-go="lista"><span class="ico">☰</span><span class="lbl"><b>Mis inspecciones</b><span id="mLista">—</span></span><span class="arw">›</span></button>
      <button data-go="tablero"><span class="ico">▤</span><span class="lbl"><b>Tablero</b><span>Resumen y estado de los locales</span></span><span class="arw">›</span></button>
      <button data-go="ajustes"><span class="ico">⚙</span><span class="lbl"><b>Ajustes</b><span>Conexión, supervisor y catálogos</span></span><span class="arw">›</span></button>
    </div>
    <p class="tiny" style="text-align:center;margin-top:16px" id="lastSync">—</p>
  </section>

  <!-- ============ NUEVA ============ -->
  <section class="screen" id="sc-nueva">
    <div class="steps"><i class="on"></i><i></i></div>
    <div class="card">
      <label class="f"><span>Fecha de la visita</span><input type="date" id="fFecha"></label>
      <label class="f"><span>Supervisor</span><select id="fSup"></select></label>
      <div class="f">
        <span class="flabel">Local</span>
        <button class="opener" id="fLocalBtn" type="button"><span class="ph" id="fLocalTxt">Buscar local…</span><span class="arw">›</span></button>
      </div>
      <label class="f" style="margin-bottom:0"><span>Rubro</span><select id="fRubro"></select></label>
    </div>
  </section>

  <!-- ============ FORMULARIO ============ -->
  <section class="screen" id="sc-form">
    <div id="fSectores"></div>
    <div class="card">
      <label class="f" style="margin-bottom:0"><span>Observaciones generales</span>
        <textarea id="fObs" placeholder="Comentarios sobre la visita en general"></textarea>
      </label>
    </div>
  </section>

  <!-- ============ LISTA ============ -->
  <section class="screen" id="sc-lista"><div id="listaBox"></div></section>

  <!-- ============ TABLERO ============ -->
  <section class="screen" id="sc-tablero"><div id="tabBox"></div></section>

  <!-- ============ AJUSTES ============ -->
  <section class="screen" id="sc-ajustes">
    <div class="card">
      <div class="eyebrow">Conexión con la planilla</div>
      <label class="f"><span>Dirección del servicio</span>
        <input type="text" id="aUrl" placeholder="https://script.google.com/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="f"><span>Clave</span>
        <input type="text" id="aTok" placeholder="La frase que pusiste en el TOKEN" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <button class="btn" id="aProbar">Probar y descargar catálogos</button>
      <p class="tiny" id="aEstado" style="margin:11px 0 0"></p>
    </div>
    <div class="card">
      <div class="eyebrow">Este dispositivo</div>
      <label class="f" style="margin-bottom:0"><span>Supervisor que lo usa</span><select id="aSup"></select></label>
    </div>
    <div class="card">
      <div class="eyebrow">Catálogos guardados</div>
      <p class="muted" id="aCat" style="margin:0 0 12px">Sin descargar todavía.</p>
      <button class="btn ghost" id="aActualizar">Actualizar catálogos</button>
    </div>
    <div class="card">
      <div class="eyebrow">Espacio</div>
      <p class="tiny" style="margin:0 0 12px">Borra del teléfono las inspecciones ya enviadas. Siguen guardadas en la planilla.</p>
      <button class="btn ghost" id="aBorrar" style="color:var(--s0);border-color:var(--s0)">Borrar inspecciones enviadas</button>
    </div>
  </section>

</main>

<!-- Buscador de locales a pantalla completa -->
<div class="sheet" id="sheet">
  <div class="sh">
    <button id="shClose" aria-label="Cerrar">‹</button>
    <input type="text" id="shInput" placeholder="Buscar local…" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="sl" id="shList"></div>
</div>

<div class="bar" id="bar" hidden></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
