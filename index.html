<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A4B">
<title>Control Mant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ===================================================================
   Control Mant — panel de instrumentos para trabajo en campo
   La única saturación de color del sistema es el semáforo.
   Todo lo demás es acero, para que el color signifique algo.
   =================================================================== */

:root{
  --ink:#131A1F;
  --ink-2:#4A5A66;
  --ink-3:#7A8B96;
  --canvas:#E9EDF0;
  --surface:#FFFFFF;
  --line:#CFD8DE;
  --steel:#1B3A4B;
  --steel-2:#2E6480;

  --s0:#C5221F;  /* Rojo    */
  --s1:#E8710A;  /* Naranja */
  --s2:#EDB100;  /* Amarillo*/
  --s3:#137333;  /* Verde   */

  --r:10px;
  --pad:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}

/* ---------- Barra superior ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--steel);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 10px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.15);
}
.top .back{
  background:none;border:0;color:#fff;font-size:22px;line-height:1;
  padding:6px 8px;margin-left:-8px;cursor:pointer;border-radius:8px;
}
.top .back:active{background:rgba(255,255,255,.14)}
.top h1{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;background:#7A8B96}
.dot.on{background:#31C48D}
.pend{
  background:rgba(255,255,255,.16);border-radius:999px;
  padding:3px 10px;font-size:13px;font-weight:700;
  border:0;color:#fff;cursor:pointer;
}
.pend.hot{background:var(--s1)}

/* ---------- Contenedor ---------- */
main{padding:var(--pad);padding-bottom:calc(96px + var(--safe-b));max-width:640px;margin:0 auto}
.screen{display:none}
.screen.on{display:block}

/* ---------- Tarjetas ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:var(--pad);margin-bottom:12px;
}
.card.tight{padding:12px var(--pad)}
.eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:6px;
}
.muted{color:var(--ink-2);font-size:14px}
.tiny{font-size:12.5px;color:var(--ink-3)}

/* ---------- Menú principal ---------- */
.menu{display:grid;gap:10px}
.menu button{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px var(--pad);cursor:pointer;
}
.menu button:active{background:#F2F6F8}
.menu .ico{
  width:38px;height:38px;border-radius:9px;background:var(--steel);
  color:#fff;display:grid;place-items:center;font-size:18px;flex-shrink:0;
}
.menu .lbl{flex:1}
.menu .lbl b{display:block;font-size:16px;font-weight:700}
.menu .lbl span{font-size:13px;color:var(--ink-2)}
.menu .arw{color:var(--ink-3);font-size:20px}

/* ---------- Campos ---------- */
label.f{display:block;margin-bottom:14px}
label.f>span{
  display:block;font-size:12px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;
}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:12px 12px;border:1px solid var(--line);
  border-radius:8px;background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel-2);outline-offset:1px}
textarea{min-height:84px;resize:vertical}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- Buscador de locales ---------- */
.pick{position:relative}
.pick .list{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;
  background:#fff;border:1px solid var(--line);border-radius:8px;
  max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(19,26,31,.16);
}
.pick .list button{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid #EEF2F4;padding:12px;cursor:pointer;
}
.pick .list button:active{background:#F2F6F8}
.pick .list .fmt{font-size:11px;color:var(--ink-3);font-weight:700}

/* ---------- Semáforo: el elemento central del sistema ---------- */
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:2px}
.grade button{
  border:1.5px solid var(--line);background:#fff;border-radius:8px;
  padding:13px 0 10px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.grade .chip{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.14)}
.grade .n{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.04em}
.grade button[data-v="0"] .chip{background:var(--s0)}
.grade button[data-v="1"] .chip{background:var(--s1)}
.grade button[data-v="2"] .chip{background:var(--s2)}
.grade button[data-v="3"] .chip{background:var(--s3)}
.grade button.sel{border-width:2.5px;background:#F7FAFB}
.grade button.sel .n{color:var(--ink)}
.grade button.sel[data-v="0"]{border-color:var(--s0)}
.grade button.sel[data-v="1"]{border-color:var(--s1)}
.grade button.sel[data-v="2"]{border-color:var(--s2)}
.grade button.sel[data-v="3"]{border-color:var(--s3)}

/* ---------- Medidor de operatividad ---------- */
.gauge{margin-top:10px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.gauge .val{font-size:19px;font-weight:800}
.gauge .track{height:7px;background:#DFE6EA;border-radius:99px;overflow:hidden}
.gauge .fill{height:100%;border-radius:99px;transition:width .2s ease}
.f0{background:var(--s0)} .f1{background:var(--s1)}
.f2{background:var(--s2)} .f3{background:var(--s3)}
.c0{color:var(--s0)} .c1{color:var(--s1)} .c2{color:var(--s2)} .c3{color:var(--s3)}

/* ---------- Sector ---------- */
.sector{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sector>summary{
  list-style:none;cursor:pointer;padding:14px var(--pad);
  display:flex;align-items:center;gap:11px;
}
.sector>summary::-webkit-details-marker{display:none}
.sector .sq{width:12px;height:12px;border-radius:3px;background:#DFE6EA;flex-shrink:0}
.sector .nm{flex:1;font-weight:700}
.sector .st{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sector .body{padding:0 var(--pad) var(--pad);border-top:1px solid #EEF2F4}

.eq{padding:13px 0;border-bottom:1px solid #F0F4F6}
.eq:last-child{border-bottom:0}
.eq .en{font-weight:650;margin-bottom:9px;font-size:15px}
.qty{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.qty label>span{font-size:11px}

.warn{
  background:#FDF3E7;border:1px solid #F0C99A;color:#8A4B08;
  border-radius:8px;padding:9px 11px;font-size:13px;margin-top:9px;
}

/* ---------- Botones ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(233,237,240,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:12px var(--pad) calc(12px + var(--safe-b));
  display:flex;gap:10px;max-width:640px;margin:0 auto;
}
.btn{
  flex:1;padding:15px;border-radius:9px;border:1px solid var(--steel);
  background:var(--steel);color:#fff;font-weight:700;cursor:pointer;
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--steel);}
.btn.danger{background:var(--s0);border-color:var(--s0)}
.btn.sm{padding:10px 14px;flex:0 0 auto;font-size:14px}

/* ---------- Lista de pendientes ---------- */
.item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px var(--pad);margin-bottom:9px;display:flex;gap:12px;align-items:center;
}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m span{font-size:12.5px;color:var(--ink-2)}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.tag.bor{background:#EEF2F4;color:var(--ink-2)}
.tag.pen{background:#FDF0E2;color:#8A4B08}
.tag.syn{background:#E4F2E8;color:#137333}
.tag.err{background:#FBE6E5;color:#9B1C19}

/* ---------- Tablero ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 11px;text-align:center}
.kpi b{display:block;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bars{display:grid;gap:9px}
.brow{display:grid;grid-template-columns:110px 1fr 44px;gap:9px;align-items:center;font-size:13.5px}
.brow .bt{height:20px;background:#DFE6EA;border-radius:4px;overflow:hidden;display:flex}
.brow .bt i{display:block;height:100%}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- Varios ---------- */
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.55}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(92px + var(--safe-b));z-index:60;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:9px;
  font-size:14px;max-width:88%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.on{opacity:1}
.steps{display:flex;gap:5px;margin-bottom:16px}
.steps i{flex:1;height:3px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--steel)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <button class="back" id="btnBack" hidden aria-label="Volver">‹</button>
  <h1 id="ttl">Control Mant</h1>
  <div class="badges">
    <span class="dot" id="dot" title="Conexión"></span>
    <button class="pend" id="pend" hidden></button>
  </div>
</header>

<main>

  <!-- ============ INICIO ============ -->
  <section class="screen on" id="sc-inicio">
    <div class="card tight" id="whoCard">
      <div class="eyebrow">Supervisor</div>
      <div id="whoName" style="font-weight:700">—</div>
    </div>
    <div class="menu">
      <button data-go="nueva"><span class="ico">✚</span><span class="lbl"><b>Nueva inspección</b><span>Cargar una visita a un local</span></span><span class="arw">›</span></button>
      <button data-go="lista"><span class="ico">☰</span><span class="lbl"><b>Mis inspecciones</b><span id="mLista">—</span></span><span class="arw">›</span></button>
      <button data-go="tablero"><span class="ico">▤</span><span class="lbl"><b>Tablero</b><span>Resumen y estado de los locales</span></span><span class="arw">›</span></button>
      <button data-go="ajustes"><span class="ico">⚙</span><span class="lbl"><b>Ajustes</b><span>Conexión, supervisor y catálogos</span></span><span class="arw">›</span></button>
    </div>
    <p class="tiny" style="text-align:center;margin-top:18px" id="lastSync">—</p>
  </section>

  <!-- ============ NUEVA ============ -->
  <section class="screen" id="sc-nueva">
    <div class="steps"><i class="on"></i><i></i></div>
    <div class="card">
      <label class="f"><span>Fecha de la visita</span><input type="date" id="fFecha"></label>
      <label class="f"><span>Supervisor</span><select id="fSup"></select></label>
      <label class="f pick"><span>Local</span>
        <input type="text" id="fLocal" placeholder="Escribí para buscar…" autocomplete="off">
        <div class="list" id="fLocalList" hidden></div>
      </label>
      <label class="f" style="margin-bottom:0"><span>Rubro</span><select id="fRubro"></select></label>
    </div>
  </section>

  <!-- ============ FORMULARIO ============ -->
  <section class="screen" id="sc-form">
    <div class="steps"><i class="on"></i><i class="on"></i></div>
    <div class="card tight">
      <div class="eyebrow" id="fHeadEye">—</div>
      <div style="font-weight:700" id="fHeadLocal">—</div>
    </div>
    <div id="fSectores"></div>
    <div class="card">
      <label class="f" style="margin-bottom:0"><span>Observaciones generales</span>
        <textarea id="fObs" placeholder="Comentarios sobre la visita en general"></textarea>
      </label>
    </div>
  </section>

  <!-- ============ LISTA ============ -->
  <section class="screen" id="sc-lista"><div id="listaBox"></div></section>

  <!-- ============ TABLERO ============ -->
  <section class="screen" id="sc-tablero"><div id="tabBox"></div></section>

  <!-- ============ AJUSTES ============ -->
  <section class="screen" id="sc-ajustes">
    <div class="card">
      <div class="eyebrow">Conexión con la planilla</div>
      <label class="f"><span>Dirección del servicio</span>
        <input type="text" id="aUrl" placeholder="https://script.google.com/…/exec" autocomplete="off">
      </label>
      <label class="f"><span>Clave</span>
        <input type="text" id="aTok" placeholder="La frase que pusiste en el TOKEN" autocomplete="off">
      </label>
      <button class="btn" id="aProbar">Probar y descargar catálogos</button>
      <p class="tiny" id="aEstado" style="margin:11px 0 0"></p>
    </div>
    <div class="card">
      <div class="eyebrow">Este dispositivo</div>
      <label class="f" style="margin-bottom:0"><span>Supervisor que lo usa</span>
        <select id="aSup"></select>
      </label>
    </div>
    <div class="card">
      <div class="eyebrow">Catálogos guardados</div>
      <p class="muted" id="aCat" style="margin:0 0 12px">Sin descargar todavía.</p>
      <button class="btn ghost" id="aActualizar">Actualizar catálogos</button>
    </div>
    <div class="card">
      <div class="eyebrow">Zona de riesgo</div>
      <p class="tiny" style="margin:0 0 12px">Borra las inspecciones de este teléfono. Las que ya se sincronizaron siguen en la planilla.</p>
      <button class="btn danger ghost" id="aBorrar" style="background:transparent;color:var(--s0)">Borrar inspecciones sincronizadas</button>
    </div>
  </section>

</main>

<div class="bar" id="bar" hidden></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
